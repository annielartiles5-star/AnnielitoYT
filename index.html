<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annielito_YT</title>

<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:radial-gradient(circle,#0f172a,#020617);color:white;text-align:center;overflow:hidden}
header{padding:40px;background:linear-gradient(90deg,#020617,#1e293b)}
h1{font-size:3.5rem;margin:0;text-shadow:0 0 25px #38bdf8}

.stats{display:flex;justify-content:center;gap:30px;margin:40px;flex-wrap:wrap}
.box{background:rgba(30,41,59,0.7);padding:40px 60px;border-radius:20px;font-size:2.5rem;box-shadow:0 0 25px rgba(0,0,0,0.7);transition:0.3s;}
.up{box-shadow:0 0 30px lime;transform:scale(1.1)}
.down{box-shadow:0 0 30px red;transform:scale(1.1)}

.btn{display:inline-block;margin-top:30px;padding:25px 60px;border-radius:20px;font-size:1.5rem;background:linear-gradient(270deg, red, green, blue, yellow, red);background-size:800% 800%;color:white;text-decoration:none;font-weight:bold;box-shadow:0 0 30px rgba(255,0,0,0.9);transition:transform 0.3s;}
.btn:hover{transform:scale(1.15);animation:rgbFlow 6s linear infinite;}
@keyframes rgbFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.footer{position:fixed;bottom:10px;right:15px;font-size:0.8rem;opacity:0.6}

/* Idiomas */
#langBtn{position:fixed;top:20px;left:20px;background:rgba(30,41,59,0.8);padding:12px 20px;border-radius:15px;cursor:pointer;font-weight:bold;box-shadow:0 0 15px #22c55e;z-index:1000}
#langBox{display:none;position:fixed;top:60px;left:20px;background:rgba(30,41,59,0.95);padding:15px;border-radius:15px;box-shadow:0 0 20px #22c55e;z-index:1000}
#langBox button{display:block;margin:5px 0;padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:bold}

/* Sugerencias */
#suggestionBtn{position:fixed;top:20px;right:180px;background:rgba(30,41,59,0.8);padding:15px 25px;border-radius:15px;cursor:pointer;font-weight:bold;box-shadow:0 0 15px #38bdf8;z-index:1000}
#suggestionBox{display:none;position:fixed;top:70px;right:180px;background:rgba(30,41,59,0.9);padding:20px;border-radius:15px;width:250px;text-align:center;box-shadow:0 0 20px #38bdf8;z-index:1000}

/* Donar */
#donateBtn{position:fixed;top:20px;right:20px;background:rgba(30,41,59,0.8);padding:15px 25px;border-radius:15px;cursor:pointer;font-weight:bold;box-shadow:0 0 15px #facc15;z-index:1000}
#donateBox,#thankYouScreen{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,41,59,0.95);padding:25px;border-radius:20px;width:320px;text-align:center;box-shadow:0 0 25px #facc15;z-index:1000}
#donateBox input{width:80%;padding:12px;border-radius:10px;margin:15px auto;display:block;text-align:center;font-weight:bold;font-size:1.1rem}
</style>
</head>

<body>

<div id="langBtn">🌐 IDIOMAS</div>
<div id="langBox">
  <button onclick="setLang('es')">🇪🇸 Español</button>
  <button onclick="setLang('pt')">🇧🇷 Português</button>
</div>

<header>
<h1 id="title">🎮 Annielito_YT</h1>
</header>

<div class="stats">
<div class="box" id="subs">🔥 Subs: 0</div>
<div class="box" id="views">👁️ Views: 0</div>
</div>

<a class="btn" id="channelBtn" href="https://www.youtube.com/@Annielito_YT" target="_blank">🚀 IR AL CANAL</a>

<!-- Sugerencias -->
<div id="suggestionBtn">💡 Sugerencias</div>
<div id="suggestionBox">
  <p id="suggestionText">Creá una sugerencia para ayudar el contenido de Annielito_YT</p>
  <a id="suggestionLink" href="https://forms.gle/n3x94yRNJkfzQKXA9" target="_blank">Crear nueva sugerencia</a>
</div>

<!-- Donar -->
<div id="donateBtn">💰 Donar</div>
<div id="donateBox">
  <p id="donateText">Apoya a Annielito_YT a mejorar su contenido con donaciones</p>
  <input type="text" value="116.045.542-23" id="pixCode" readonly>
  <button id="copyPix">Copiar código PIX</button>
  <button id="doneDonate">¡Ya doné!</button>
</div>
<div id="thankYouScreen">
  <p id="thanksText">🙏 Gracias por tu apoyo, eres increíble!</p>
</div>

<div class="footer">Made by Annielito Studios</div>

<script>
// idiomas
const texts={
 es:{
  channel:"🚀 IR AL CANAL",
  suggest:"💡 Sugerencias",
  suggestText:"Crea una sugerencia para ayudar el contenido de Annielito_YT",
  suggestBtn:"Crear nueva sugerencia",
  donate:"💰 Donar",
  donateText:"Apoya a Annielito_YT a mejorar su contenido con donaciones",
  copy:"Copiar código PIX",
  done:"¡Ya doné!",
  thanks:"🙏 Gracias por tu apoyo, eres increíble!"
 },
 pt:{
  channel:"🚀 IR PARA O CANAL",
  suggest:"💡 Sugestões",
  suggestText:"Crie uma sugestão para ajudar o conteúdo de Annielito_YT",
  suggestBtn:"Criar nova sugestão",
  donate:"💰 Doar",
  donateText:"Apoie Annielito_YT a melhorar seu conteúdo com doações",
  copy:"Copiar código PIX",
  done:"Já doei!",
  thanks:"🙏 Obrigado pelo seu apoio!"
 }
};

function setLang(lang){
 const t=texts[lang];
 document.getElementById("channelBtn").innerText=t.channel;
 document.getElementById("suggestionBtn").innerText=t.suggest;
 document.getElementById("suggestionText").innerText=t.suggestText;
 document.getElementById("suggestionLink").innerText=t.suggestBtn;
 document.getElementById("donateBtn").innerText=t.donate;
 document.getElementById("donateText").innerText=t.donateText;
 document.getElementById("copyPix").innerText=t.copy;
 document.getElementById("doneDonate").innerText=t.done;
 document.getElementById("thanksText").innerText=t.thanks;
}

document.getElementById("langBtn").onclick=()=>{
 const box=document.getElementById("langBox");
 box.style.display=box.style.display==='block'?'none':'block';
};

// botones
suggestionBtn.onclick=()=> suggestionBox.style.display = suggestionBox.style.display==='block'?'none':'block';
donateBtn.onclick=()=> donateBox.style.display = donateBox.style.display==='block'?'none':'block';
copyPix.onclick=()=>{navigator.clipboard.writeText(pixCode.value);alert('PIX copiado');};
doneDonate.onclick=()=>{donateBox.style.display='none';thankYouScreen.style.display='block';};

</script>

</body>
</html>
