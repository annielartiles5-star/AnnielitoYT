<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annielito_YT</title>

<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:radial-gradient(circle,#0f172a,#020617);color:white;text-align:center;overflow:hidden}
header{padding:40px;background:linear-gradient(90deg,#020617,#1e293b)}
h1{font-size:3.5rem;margin:0;text-shadow:0 0 25px #38bdf8}

.stats{display:flex;justify-content:center;gap:30px;margin:40px;flex-wrap:wrap}
.box{
  background:rgba(30,41,59,0.7);
  padding:40px 60px;
  border-radius:20px;
  font-size:2.5rem;
  box-shadow:0 0 25px rgba(0,0,0,0.7);
  transition:0.3s;
}

.up{box-shadow:0 0 30px lime;transform:scale(1.1)}
.down{box-shadow:0 0 30px red;transform:scale(1.1)}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:25px 60px;
  border-radius:20px;
  font-size:1.5rem;
  background:linear-gradient(270deg, red, green, blue, yellow, red);
  background-size:800% 800%;
  color:white;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 0 30px rgba(255,0,0,0.9);
  transition:transform 0.3s;
}

.btn:hover{
  transform:scale(1.15);
  animation:rgbFlow 6s linear infinite;
}

@keyframes rgbFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.footer{
  position:fixed;
  bottom:10px;
  right:15px;
  font-size:0.8rem;
  opacity:0.6;
}

/* partículas */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.7;
  animation:float linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh)}
  to{transform:translateY(-10vh)}
}
</style>
</head>

<body>

<audio id="upSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="downSound" src="https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3"></audio>

<header>
<h1>🎮 Annielito_YT</h1>
</header>

<div class="stats">
<div class="box" id="subs">🔥 Subs: 0</div>
<div class="box" id="views">👁️ Views: 0</div>
</div>

<a class="btn" href="https://www.youtube.com/@Annielito_YT" target="_blank">
🚀 IR AL CANAL
</a>

<div class="footer">Made by Annielito Studios</div>

<script>
const API_KEY="AIzaSyBm0gNG2BshwYlz5aSSdSDtNKisQh6hHjk";
const CHANNEL_ID="UC0e15l_V3A4H_L9rexHwvhw";

let lastSubs=null;
let currentSubs=0;
let currentViews=0;

function animateNumber(element, start, end){
 let startTime=null;
 const duration=1000;

 function step(timestamp){
  if(!startTime) startTime=timestamp;
  const progress=Math.min((timestamp-startTime)/duration,1);
  const value=Math.floor(progress*(end-start)+start);
  const label = element.id === 'subs' ? '🔥 Subs: ' : '👁️ Views: ';
  element.innerText = label + value.toLocaleString();
  if(progress<1) requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
}

async function getData(){
 try{
  const res=await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`);
  const data=await res.json();

  const stats=data.items[0].statistics;
  const subs=Number(stats.subscriberCount);
  const views=Number(stats.viewCount);

  const subsEl=document.getElementById("subs");
  const viewsEl=document.getElementById("views");

  if(lastSubs!==null){
    if(subs>lastSubs){
      subsEl.classList.add("up");
      document.getElementById("upSound").play();
    } else if(subs<lastSubs){
      subsEl.classList.add("down");
      document.getElementById("downSound").play();
    }

    setTimeout(()=>subsEl.classList.remove("up","down"),1500);
  }

  animateNumber(subsEl,currentSubs,subs);
  animateNumber(viewsEl,currentViews,views);

  currentSubs=subs;
  currentViews=views;
  lastSubs=subs;

 }catch(e){
  document.getElementById("subs").innerText="Error 😢";
 }
}

// partículas
for(let i=0;i<80;i++){
 const p=document.createElement("div");
 p.className="particle";
 p.style.left=Math.random()*100+"vw";
 p.style.animationDuration=(5+Math.random()*10)+"s";
 document.body.appendChild(p);
}

getData();
setInterval(getData,15000);

</script>

</body>
</html>
