<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Annielito YT PRO 3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
      text-align: center;
    }

    header {
      padding: 40px;
      background: linear-gradient(90deg, #1e293b, #020617);
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      text-shadow: 0 0 15px #38bdf8;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .box {
      font-size: 1.5rem;
      padding: 20px;
      border-radius: 15px;
      background: rgba(30,41,59,0.6);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: linear-gradient(45deg, red, orange);
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255,0,0,0.8);
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.15);
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      padding: 30px;
    }

    .video-card {
      background: rgba(30,41,59,0.6);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      transition: 0.3s;
    }

    .video-card:hover {
      transform: scale(1.05);
    }

    .video-card img {
      width: 100%;
    }

    .video-card p {
      padding: 10px;
      font-size: 0.9rem;
    }

    #moreBtn {
      margin: 20px;
      cursor: pointer;
      font-size: 1.2rem;
      color: #38bdf8;
    }

  </style>
</head>
<body>

<header>
  <h1>🎮 Annielito_YT</h1>
</header>

<div class="stats">
  <div class="box" id="subs">Subs: ...</div>
  <div class="box" id="views">Views: ...</div>
</div>

<a class="btn" href="https://www.youtube.com/@Annielito_YT" target="_blank">
  🚀 Ir al canal
</a>

<h2>🔥 Videos</h2>
<div class="videos" id="videoContainer"></div>
<div id="moreBtn">➡️ Más videos</div>

<script>
const API_KEY = "AIzaSyCeCF4PPbkrouoDfvXNRYpxZHMNpapmUAU";
const CHANNEL_ID = "UC0e15l_V3A4H_L9rexHwvhw";

let allVideos = [];
let showingAll = false;

async function getData() {
  try {
    const channelRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`);
    const channelData = await channelRes.json();

    const stats = channelData.items[0].statistics;

    document.getElementById("subs").innerText = "🔥 Subs: " + Number(stats.subscriberCount).toLocaleString();
    document.getElementById("views").innerText = "👁️ Views: " + Number(stats.viewCount).toLocaleString();

    const videoRes = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=date&maxResults=12`);
    const videoData = await videoRes.json();

    allVideos = videoData.items.filter(v => v.id.videoId);
    showVideos();

  } catch (e) {
    document.getElementById("subs").innerText = "Error 😢";
  }
}

function showVideos() {
  const container = document.getElementById("videoContainer");
  container.innerHTML = "";

  const videosToShow = showingAll ? allVideos : allVideos.slice(0,3);

  videosToShow.forEach(v => {
    const card = document.createElement("div");
    card.className = "video-card";

    card.innerHTML = `
      <a href="https://www.youtube.com/watch?v=${v.id.videoId}" target="_blank">
        <img src="${v.snippet.thumbnails.medium.url}">
      </a>
      <p>${v.snippet.title}</p>
    `;

    container.appendChild(card);
  });
}

// botón más videos
document.getElementById("moreBtn").onclick = () => {
  showingAll = !showingAll;
  document.getElementById("moreBtn").innerText = showingAll ? "⬅️ Menos videos" : "➡️ Más videos";
  showVideos();
};

// Views estáticas (reales, sin simulación en vivo)

getData();

// 🔄 Actualizar subs y datos cada 15 segundos
setInterval(() => {
  getData();
}, 15000);
</script>

</body>
</html>
